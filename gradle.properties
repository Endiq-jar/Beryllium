# Give Loom enough heap while preparing the large multi-version Minecraft development jars.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric / Loom.  Minecraft itself is selected with -Pminecraft_version; 26.1+
# automatically uses Loom's non-remapping plugin while older releases use remapping.
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.2.0
group=com.endiq

# Only used by the retained 1.21.4 renderer profile.
fabric_api_version=0.119.4+1.21.4

# Default local target. CI resolves every release from 1.19.4 to Mojang's latest.
minecraft_version=1.21.4
