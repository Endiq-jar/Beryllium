# TEMPORARY diagnostic workflow — removed before merge.
#
# The workspace this change is developed in has no JDK and no Maven/Gradle network access, and
# neither GitHub's log-download endpoint nor the artifact blob store is reachable from it, so
# the real vanilla API and the real compile results cannot be inspected locally. This workflow
# builds every covered release with the exact CI command and commits the results to the branch
# so they can be read with a normal `git show`.
#
# It is deliberately ONE job with a sequential loop: an earlier version used a matrix plus
# upload/download-artifact to collect the logs, and the collection step silently lost most of
# them. A single job writing straight into the working tree cannot lose anything.
name: probe

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: write

concurrency:
  group: beryllium-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: probe every covered release
    # The commit at the end of this job would otherwise re-trigger the whole thing, forever.
    if: ${{ !contains(github.event.head_commit.message, 'ci-probe:') }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft
          cache: gradle

      - name: make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: write the classpath probe init script
        run: |
          cat > /tmp/probe-init.gradle <<'EOF'
          allprojects { proj ->
              proj.tasks.register('berylliumProbeClasspath') {
                  doLast {
                      def cp = new LinkedHashSet()
                      for (String name : ['main', 'client']) {
                          try {
                              cp.addAll(proj.extensions.getByName('sourceSets').getByName(name).compileClasspath.files)
                          } catch (Throwable ignored) {
                              // source set does not exist on this release
                          }
                      }
                      new File(proj.projectDir, 'probe-cp.txt').text =
                          cp.findAll { it != null && it.exists() }.collect { it.absolutePath }.join(':')
                  }
              }
          }
          EOF

      - name: build every release exactly like CI does
        run: |
          set -u
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p ci-probe
          rm -rf ci-probe/*
          python3 scripts/resolve_minecraft_releases.py > /tmp/matrix.json
          VERSIONS=$(python3 -c "import json;print(' '.join(e['minecraft'] for e in json.load(open('/tmp/matrix.json'))['include']))")
          echo "probing: $VERSIONS"

          for V in $VERSIONS; do
            echo "=================== $V"
            LOG="ci-probe/compile-$V.log"
            rm -f probe-cp.txt

            # Vanilla signatures, so an API that moved can be read directly.
            ./gradlew --no-daemon --console=plain -I /tmp/probe-init.gradle \
              -Pminecraft_version="$V" berylliumProbeClasspath > /tmp/setup.txt 2>&1 || true
            CP="$(cat probe-cp.txt 2>/dev/null || true)"
            {
              echo "## minecraft $V"
              echo "## commit: $COMMIT"
              echo "## source files: $(find src -name '*.java' | wc -l)"
              echo
              for CLS in \
                net.minecraft.client.gui.Font \
                'net.minecraft.client.gui.Font$DisplayMode' \
                net.minecraft.client.Camera \
                net.minecraft.client.Minecraft \
                net.minecraft.client.renderer.LevelRenderer \
                net.minecraft.client.renderer.SectionRenderDispatcher \
                net.minecraft.client.renderer.ViewArea \
                net.minecraft.client.renderer.blockentity.AbstractSignRenderer \
                net.minecraft.client.renderer.blockentity.SignRenderer \
                net.minecraft.client.renderer.blockentity.BeaconRenderer \
                net.minecraft.client.renderer.blockentity.BlockEntityRenderer \
                net.minecraft.client.renderer.blockentity.BlockEntityRenderDispatcher \
                net.minecraft.client.renderer.entity.EntityRenderDispatcher \
                net.minecraft.client.particle.ParticleEngine \
                net.minecraft.world.entity.Entity \
                net.minecraft.world.level.Level \
                net.minecraft.server.level.ServerLevel \
                net.minecraft.world.level.chunk.LevelChunk \
                net.minecraft.world.level.ChunkPos ; do
                echo "=== $CLS"
                javap -p -cp "$CP" "$CLS" 2>&1 | head -120 || echo "MISSING"
                echo
              done
            } > "ci-probe/signatures-$V.txt" 2>&1 || true

            # The real thing: the same command CI runs for the artifact.
            set +e
            ./gradlew --no-daemon --console=plain clean build \
              -Pminecraft_version="$V" > /tmp/gradle-out.txt 2>&1
            GRADLE_EXIT=$?
            python3 scripts/validate_built_mod.py build/libs "$V" > /tmp/validate.txt 2>&1
            VALIDATE_EXIT=$?
            set -e

            {
              echo "## minecraft $V"
              echo "## commit: $COMMIT"
              echo "## gradle exit: $GRADLE_EXIT, validate exit: $VALIDATE_EXIT"
              echo "## compile errors: $(grep -c 'error:' /tmp/gradle-out.txt || true)"
              echo "## access widener: $(head -1 .gradle/beryllium/beryllium.accesswidener 2>/dev/null || echo MISSING)"
              echo "## packaged widener: $(unzip -p build/libs/*.jar beryllium.accesswidener 2>/dev/null | head -1 || echo MISSING)"
              echo "## validate output: $(cat /tmp/validate.txt | tr '\n' ' ')"
              echo
              tail -c 200000 /tmp/gradle-out.txt
            } > "$LOG"
            echo "$V done: gradle=$GRADLE_EXIT validate=$VALIDATE_EXIT"
            rm -f probe-cp.txt
          done

      - name: publish the probe output
        run: |
          git config user.name "beryllium-ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git add -A ci-probe
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ci-probe: build every covered release ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && \
               git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "published"
              exit 0
            fi
            sleep 5
          done
          echo "could not publish the probe output" >&2
          exit 1
