name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
concurrency:
  group: beryllium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-matrix:
    name: resolve complete Minecraft release matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      latest: ${{ steps.releases.outputs.latest }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: resolve every release from 1.19.4 through latest
        id: releases
        run: python3 scripts/resolve_minecraft_releases.py --github-output

      - name: show coverage
        run: |
          echo "Latest release: ${{ steps.releases.outputs.latest }}"
          echo '${{ steps.releases.outputs.matrix }}' | python3 -m json.tool

  build:
    name: Minecraft ${{ matrix.minecraft }} (${{ matrix.loom_pipeline }})
    needs: release-matrix
    runs-on: ubuntu-24.04
    strategy:
      # Continue compiling every other version if one target fails.
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft
          cache: gradle

      - name: make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build exact-version artifact
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build -Pminecraft_version=${{ matrix.minecraft }} 2>&1 | tee build-output.log

      # The raw Actions log blobs are unavailable to some API clients; publish the
      # Gradle failure (compile errors) through the Checks API instead: patch the
      # check-run summary and emit compact annotations.
      - name: publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compact per-error annotations (symbol + location on one line each).
          grep -E "error: |Caused by: |What went wrong: |Cannot add |Could not |Failed to" build-output.log \
            | sed 's/^[[:space:]]*//' | sort -u | head -10 \
            | while IFS= read -r line; do echo "::error::${line:0:500}"; done || true

          # Full error section into the check-run summary (readable via the Checks API).
          errors=$(grep -n -A 3 "error: " build-output.log | head -c 55000 || true)
          [ -z "$errors" ] && errors=$(tail -c 55000 build-output.log)
          job_name="Minecraft ${{ matrix.minecraft }} (${{ matrix.loom_pipeline }})"
          job_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq --arg n "$job_name" '.jobs[] | select(.name==$n) | .id' | head -1)
          if [ -n "$job_id" ]; then
            gh api "repos/${{ github.repository }}/check-runs/$job_id" -X PATCH \
              -f "output[title]=Gradle failure — ${{ matrix.minecraft }} (${{ matrix.loom_pipeline }})" \
              -f "output[summary]=$(printf '%s' "$errors" | head -c 60000)" || true
          fi

      - name: validate generated mod metadata
        run: python3 scripts/validate_built_mod.py build/libs '${{ matrix.minecraft }}'

      - name: capture Minecraft ${{ matrix.minecraft }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beryllium-${{ matrix.id }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
