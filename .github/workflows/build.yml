name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
concurrency:
  group: beryllium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-matrix:
    name: resolve complete Minecraft release matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      latest: ${{ steps.releases.outputs.latest }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: resolve every release from 1.19.4 through latest
        id: releases
        run: python3 scripts/resolve_minecraft_releases.py --github-output

      - name: show coverage
        run: |
          echo "Latest release: ${{ steps.releases.outputs.latest }}"
          echo '${{ steps.releases.outputs.matrix }}' | python3 -m json.tool

  build:
    name: Minecraft ${{ matrix.minecraft }} (${{ matrix.loom_pipeline }})
    needs: release-matrix
    runs-on: ubuntu-24.04
    strategy:
      # Continue compiling every other version if one target fails.
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft
          cache: gradle

      - name: make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build exact-version artifact
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build -Pminecraft_version=${{ matrix.minecraft }} 2>&1 | tee build-output.log

      # Publish per-version API reference + any Gradle failure through the Checks API:
      # the raw Actions log blobs are unavailable to some API clients, and the mapped
      # Minecraft classes only exist where Mojang's servers are reachable (CI). This is
      # what answers "what does class X look like on version Y" during cross-version
      # maintenance without guessing.
      - name: capture api reference and diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## API reference — Minecraft ${{ matrix.minecraft }} (${{ matrix.loom_pipeline }})"
            jars=$(find ~/.gradle/caches/fabric-loom -name "*.jar" -path "*minecraft*" \
              ! -name "*sources*" ! -name "*mappings*" 2>/dev/null | sort | head -20)
            cp=""
            for j in $jars; do cp="$cp$j:"; done
            if [ -n "$cp" ]; then
              for cls in \
                net.minecraft.client.Camera \
                net.minecraft.client.renderer.entity.EntityRenderDispatcher \
                net.minecraft.client.renderer.blockentity.ChestRenderer \
                net.minecraft.client.renderer.blockentity.BeaconRenderer \
                net.minecraft.client.renderer.blockentity.BlockEntityRenderDispatcher \
                net.minecraft.world.level.ChunkPos \
                net.minecraft.world.entity.Entity \
                net.minecraft.world.level.Level \
              ; do
                echo ""
                echo "=== $cls"
                "$JAVA_HOME/bin/javap" -classpath "$cp" "$cls" 2>&1 \
                  | grep -vE "^\s*(static \{\}|[A-Za-z0-9_$]+\(\);)" | head -120
              done
            else
              echo "no mapped minecraft jars found in the loom cache"
            fi
          } > api-reference.txt 2>&1 || true

          {
            if [ -f build-output.log ]; then
              echo "## Gradle errors (if any)"
              grep -n -A 3 "error: " build-output.log | head -c 20000 || echo "(no javac errors)"
              echo
              echo "## Gradle tail"
              tail -c 12000 build-output.log
            fi
            cat api-reference.txt
          } > diagnostics.txt

          job_name="Minecraft ${{ matrix.minecraft }} (${{ matrix.loom_pipeline }})"
          job_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '.jobs[] | [.id, .name] | @tsv' \
            | awk -F'\t' -v target="$job_name" '$2 == target {print $1; exit}')
          if [ -z "$job_id" ]; then
            echo "::error::diagnostics: could not resolve check-run id for '$job_name'"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/check-runs/$job_id" -X PATCH \
            -f "output[title]=Beryllium — Minecraft ${{ matrix.minecraft }} (${{ matrix.loom_pipeline }})" \
            -f "output[summary]=$(head -c 60000 diagnostics.txt)" || \
            echo "::error::diagnostics: summary patch failed"

      - name: publish failure annotations
        if: failure()
        run: |
          grep -E "error: |Caused by: |What went wrong: |Cannot add |Could not |Failed to" build-output.log \
            | sed 's/^[[:space:]]*//' | sort -u | head -10 \
            | while IFS= read -r line; do echo "::error::${line:0:500}"; done || true

      - name: validate generated mod metadata
        run: python3 scripts/validate_built_mod.py build/libs '${{ matrix.minecraft }}'

      - name: capture Minecraft ${{ matrix.minecraft }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beryllium-${{ matrix.id }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
