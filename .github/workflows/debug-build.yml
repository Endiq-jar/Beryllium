# TEMPORARY diagnostic workflow — removed before merge.
#
# The workspace this change was developed in has no JDK and no Maven/Gradle network
# access, and GitHub's log-download endpoint is not reachable from it either. This job
# runs the real build for one target and commits the tail of the Gradle output back to
# the branch, so the failure can be read from a normal `git show`.
name: debug-build

on:
  workflow_dispatch:
    inputs:
      minecraft:
        description: "Minecraft version to build"
        required: true
        default: "1.21.4"
      target:
        description: "Gradle task to run"
        required: false
        default: "compileJava compileClientJava"

permissions:
  contents: write

concurrency:
  group: beryllium-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: debug ${{ inputs.minecraft }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft
          cache: gradle

      - name: make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: run build and capture output
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain ${{ inputs.target }} -Pminecraft_version=${{ inputs.minecraft }} > gradle-out.txt 2>&1
          echo "gradle_exit=$?" >> "$GITHUB_OUTPUT"

      - name: commit the captured output
        run: |
          mkdir -p .ci-debug
          { echo "## gradle ${{ inputs.target }} -Pminecraft_version=${{ inputs.minecraft }}"
            echo "## exit=${{ steps.build.outputs.gradle_exit }}"
            echo
            tail -c 200000 gradle-out.txt; } > .ci-debug/gradle-${{ inputs.minecraft }}.log
          rm -f gradle-out.txt
          git config user.name "beryllium-ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git add .ci-debug
          git commit -m "ci-debug: build output for ${{ inputs.minecraft }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
