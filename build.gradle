plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// Temporary: print failing task exceptions as Actions annotations.
gradle.addListener(new org.gradle.api.execution.TaskExecutionListener() {
	void beforeExecute(org.gradle.api.Task task) {}
	void afterExecute(org.gradle.api.Task task, org.gradle.api.tasks.TaskState state) {
		if (state.failure == null) {
			return
		}
		def thrown = state.failure
		def parts = []
		while (thrown != null && parts.size() < 8) {
			parts << thrown.getClass().getSimpleName() + ": " + String.valueOf(thrown.getMessage())
			thrown = thrown.getCause()
		}
		def msg = ("Task " + task.getPath() + " failed: " + parts.join(" | ")).replace('\n', ' ').replace('\r', '')
		if (msg.length() > 3500) {
			msg = msg.substring(0, 3500)
		}
		println("::error file=build.gradle,line=1::" + msg)
	}
})

repositories {
	// Loom already adds the Minecraft/Mojang/Fabric maven repositories it needs.
	// Add anything else here only when depending on other mods.
}

loom {
	accessWidenerPath = file("src/main/resources/beryllium.accesswidener")

	splitEnvironmentSourceSets()

	mods {
		"beryllium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change versions, see gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API — used for client lifecycle hooks (Phase 1) and rendering-related
	// events in later phases.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
