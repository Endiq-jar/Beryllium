import org.gradle.api.JavaVersion
import org.gradle.api.tasks.compile.JavaCompile

/*
 * One source tree produces one exact-Minecraft artifact at a time.  The CI workflow
 * feeds every released Minecraft version from 1.19.4 through Mojang's current latest
 * release into -Pminecraft_version, rather than maintaining a lossy hand-written
 * matrix.  A released artifact therefore always advertises one exact game version.
 */
def minecraftVersion = providers.gradleProperty("minecraft_version").getOrElse("26.2")
def loaderVersion = providers.gradleProperty("loader_version").getOrElse("0.19.5")
// Fabric API is deliberately not a dependency (see the dependency block); the property is
// kept only so an existing local/CI override does not break the build.
def fabricApiVersion = providers.gradleProperty("fabric_api_version").getOrElse("")
def berylliumVersion = providers.gradleProperty("mod_version").getOrElse("0.2.0")

/**
 * Mojang stopped obfuscating the distributed game jar in 26.1.  Fabric Loom uses a
 * deliberately separate plugin for that format; selecting it here is what lets the
 * same command build both 1.19.4 and current releases.
 */
def numericVersion = { String value ->
	def match = (value =~ /^(\d+)\.(\d+)(?:\.(\d+))?$/)
	if (!match.matches()) {
		throw new GradleException("minecraft_version must be a released numeric version, got '${value}'")
	}
	return [match.group(1).toInteger(), match.group(2).toInteger(),
			match.group(3) == null ? 0 : match.group(3).toInteger()]
}
def versionParts = numericVersion(minecraftVersion)
def unobfuscatedGame = versionParts[0] >= 26
apply plugin: unobfuscatedGame ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

group = 'com.endiq'
version = "${berylliumVersion}+mc${minecraftVersion}"

base {
	archivesName = "beryllium-mc${minecraftVersion}"
}

/*
 * ONE source tree, one optimization set, every supported release.
 *
 * Beryllium used to ship a stripped "compatibility core" for every release except one,
 * because Minecraft's renderer internals and mapping format have changed repeatedly
 * between 1.19.4 and now. That split meant most artifacts carried almost none of the mod.
 *
 * The mixins are now written so the same file is safe everywhere instead: every injector
 * declares an explicit descriptor with `require = 0` (a renamed target is skipped, never
 * guessed), version-only classes are targeted by string so nothing has to link against
 * them at compile time, and the two classes that genuinely only exist in part of the range
 * are excluded per-release below. Anything that does not apply on a given version degrades
 * to vanilla behaviour for that version -- it does not crash and it does not corrupt.
 *
 * Android safety is unaffected: `androidSafeMode` still suppresses every Beryllium mixin
 * on Android/Pojav/Zalith/TurtleLauncher-style hosts before the title screen.
 */

/** True when the selected release is at or newer than [major, minor, patch]. */
def mcAtLeast = { int major, int minor, int patch ->
	if (versionParts[0] != major) {
		return versionParts[0] > major
	}
	if (versionParts[1] != minor) {
		return versionParts[1] > minor
	}
	return versionParts[2] >= patch
}

// ViewArea replaced SectionRenderDispatcher in the 1.21.2 renderer refactor.
def hasViewArea = mcAtLeast(1, 21, 2)
// Font#drawInBatch and org.joml.Matrix4f exist from 1.19.4 to 26.1; 26.2 replaced them with
// Font#prepareText and Font$PreparedText, so the mixins that hook them are excluded there.
def textUsesDrawInBatch = !mcAtLeast(1, 26, 2)
/*
 * Block entity rendering became an extract/submit pipeline in 1.21.9: the dispatcher stopped
 * drawing and started *returning* a render state that the caller submits later. Every hook
 * that answers "there is nothing to draw here" therefore names that render state in its
 * callback type, and the type only exists from 1.21.9 on. Those releases build the file below;
 * older ones keep the direct render hook, which needs no such type.
 */
def hasExtractRenderState = mcAtLeast(1, 21, 9)
/*
 * GuiMessage and GuiMessageTag moved into net.minecraft.client.multiplayer.chat with the 26.x
 * line. The unsigned-message hook names the tag type as its callback type, so one of the two
 * package variants is built per release; the entry for the other is removed from the config.
 */
def hasMovedChatTypes = unobfuscatedGame || versionParts[0] >= 22
/*
 * Mixins that are only built on part of the range, by simple class name as the configs spell
 * them. Two things follow from this one list: the class file is excluded from the compile, and
 * its entry is removed from the mixin config that ships -- a config naming a class that is not
 * in the jar is a load failure on exactly the releases the class was excluded for.
 */
def eraExcludedMixins = [] as Set
if (!textUsesDrawInBatch) {
	eraExcludedMixins << 'text.FontSignTextMixin'
}
if (!hasViewArea) {
	eraExcludedMixins << 'chunk.ViewAreaMixin'
}
if (!hasExtractRenderState) {
	eraExcludedMixins << 'render.BlockEntityExtractMixin'
}
eraExcludedMixins << (hasMovedChatTypes ? 'chat.ChatUnsignedIconLegacyMixin' : 'chat.ChatUnsignedIconModernMixin')

/*
 * The access widener is generated, not shipped as a literal resource, because the namespace
 * on its first line depends on the release being built: Mojang stopped obfuscating the game
 * jar in 26.1, and from there Loom (and Fabric Loader) require the widener to be written in
 * the *official* namespace rather than the named one. The entries themselves are Mojang
 * names on every release, so only the header changes.
 *
 * Beryllium's voxel-shape engine subclasses vanilla shapes and needs three members that are
 * package-private or protected on the older releases (public on newer ones); widening them
 * is what lets one source tree compile for 1.19.4 through current.
 */
def accessWidenerSource = file('src/main/accesswidener/beryllium.accesswidener')
// Deliberately NOT under build/: CI builds with `clean build`, and a generated file inside
// build/ would be deleted by `clean` after configuration generated it but before
// processResources packaged it -- producing a jar that declares an access widener it does
// not contain. `.gradle/` survives clean and is already ignored by git.
def accessWidenerDir = file("${rootDir}/.gradle/beryllium")
def accessWidenerFile = new File(accessWidenerDir, 'beryllium.accesswidener')

def accessWidenerLines = accessWidenerSource.readLines()
def accessWidenerHeader = accessWidenerLines.find { it.startsWith('accessWidener') }
def accessWidenerVersion = (accessWidenerHeader =~ /v(\d+)/)[0][1]
// v2 is the first format Fabric allows an "official" namespace in.
def accessWidenerNamespace = unobfuscatedGame ? 'official' : 'named'
def accessWidenerFormatVersion = unobfuscatedGame ? '2' : accessWidenerVersion
accessWidenerDir.mkdirs()
accessWidenerFile.text = (["accessWidener v${accessWidenerFormatVersion} ${accessWidenerNamespace}"]
		+ accessWidenerLines.drop(1)).join('\n') + '\n'

loom {
	accessWidenerPath = accessWidenerFile
	splitEnvironmentSourceSets()

	mods {
		"beryllium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

/*
 * Two files only exist on part of the supported range. They are excluded by release AFTER
 * Loom has created the split source sets (referencing `sourceSets.client` before
 * `splitEnvironmentSourceSets()` would create an unmanaged source set and make Loom's own
 * split fail), so the same tree compiles everywhere without pre-processor tricks.
 */
sourceSets {
	main {
		resources {
			// The generated widener, namespace-correct for this release, is what ships.
			srcDir accessWidenerDir
		}
	}
	client {
		java {
			if (!textUsesDrawInBatch) {
				// 26.2+ prepares text once and submits it later; the per-draw hooks that make
				// sign text cheap no longer exist, so these files are only built below it.
				exclude 'com/endiq/beryllium/mixin/text/FontSignTextMixin.java'
			}
			if (!hasViewArea) {
				// ViewArea does not exist before 1.21.2; the LevelRenderer-level hook and
				// SectionDirtyBridge (reflection) already cover those releases.
				exclude 'com/endiq/beryllium/mixin/chunk/ViewAreaMixin.java'
			}
			if (!hasExtractRenderState) {
				// Before 1.21.9 there is no render state to return; BlockEntityCullMixin
				// hooks the direct render call on those releases instead.
				exclude 'com/endiq/beryllium/mixin/render/BlockEntityExtractMixin.java'
			}
			// Exactly one of these names the chat tag type, and its package depends on the
			// release: net.minecraft.client before the 26.x line, net.minecraft.client.
			// multiplayer.chat from there on.
			exclude (hasMovedChatTypes
					? 'com/endiq/beryllium/mixin/chat/ChatUnsignedIconLegacyMixin.java'
					: 'com/endiq/beryllium/mixin/chat/ChatUnsignedIconModernMixin.java')
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"

	// Obfuscated releases need named mappings for Loom's remap pipeline.  26.1+
	// ships unobfuscated and must not be given a mapping dependency.
	if (!unobfuscatedGame) {
		mappings loom.officialMojangMappings()
	}

	// The remapping plugin supplies Loom's modImplementation configuration. The
	// unobfuscated 26.1+ plugin intentionally uses Gradle's normal implementation
	// configuration instead, because no mod bytecode remapping is necessary.
	if (unobfuscatedGame) {
		implementation "net.fabricmc:fabric-loader:${loaderVersion}"
	} else {
		modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
	}

	/*
	 * No Fabric API dependency, on any release.
	 *
	 * Beryllium used to depend on Fabric API for three client events and the debug HUD.
	 * Those APIs were renamed and reshaped inside the supported range, and Fabric API does
	 * not publish a build for every release CI resolves from Mojang's manifest, so a hard
	 * dependency would make "one artifact per release" impossible. Beryllium now gets its
	 * per-frame clock from a mixin into Minecraft#runTick, world changes from
	 * Minecraft#setLevel, and registers the debug HUD reflectively when Fabric API happens
	 * to be installed (see HudOverlayBridge). Every artifact therefore needs Fabric Loader
	 * only -- which is also what keeps Android launchers happy.
	 */
}

processResources {
	def accessWidenerDeclaration = '"accessWidener": "beryllium.accesswidener",'
	def mixinDeclaration = '''"mixins": [
		"beryllium.mixins.json",
		{
			"config": "beryllium.client.mixins.json",
			"environment": "client"
		}
	],'''
	def clientEntrypoint = 'com.endiq.beryllium.BerylliumClient'
	def fabricApiDependency = ''

	inputs.properties([
		version: project.version,
		minecraft_version: minecraftVersion,
		access_widener_declaration: accessWidenerDeclaration,
		mixin_declaration: mixinDeclaration,
		client_entrypoint: clientEntrypoint,
		fabric_api_dependency: fabricApiDependency
	])

	filesMatching('fabric.mod.json') {
		expand([
			version: project.version,
			minecraft_version: minecraftVersion,
			access_widener_declaration: accessWidenerDeclaration,
			mixin_declaration: mixinDeclaration,
			client_entrypoint: clientEntrypoint,
			fabric_api_dependency: fabricApiDependency
		])
	}
}

/*
 * Beryllium deliberately stays at Java 17 bytecode.  That is the runtime floor for
 * 1.19.4 and the Android Java launchers this project targets;
 * newer Minecraft versions can load Java-17 mod bytecode unchanged.  CI itself uses
 * Java 25 because 26.1+ requires it to prepare the development game jars.
 */
/*
 * Remove the era-excluded entries from the mixin configs that ship.
 *
 * Run after the resource has been copied, on the copied file, because Gradle's text filter is
 * line based -- and a value removed from the middle of a JSON array leaves a comma behind that
 * is no longer valid JSON. Rewriting the whole file through the JSON reader and writer cannot
 * leave a trailing comma behind.
 *
 * Every release that excludes nothing packages the checked-in configs untouched, so the files
 * in the repository are exactly what most of the artifacts contain.
 */
def removeEraExcludedMixins = { File config ->
	if (eraExcludedMixins.isEmpty()) {
		return
	}
	try {
		def root = new groovy.json.JsonSlurper().parseText(config.getText('UTF-8'))
		boolean changed = false
		['mixins', 'client', 'server'].each { key ->
			def declared = root[key]
			if (declared instanceof List) {
				def kept = declared.findAll { entry -> !eraExcludedMixins.contains(entry) }
				if (kept.size() != declared.size()) {
					root[key] = kept
					changed = true
				}
			}
		}
		if (changed) {
			config.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(root)), 'UTF-8')
		}
	} catch (Throwable ignored) {
		// A config that cannot be read is left for Mixin to report; it is never half-written.
	}
}

tasks.matching { task -> task.name == 'processResources' || task.name == 'processClientResources' }
		.configureEach { task ->
			// Re-run when this release's exclusion set changes, not only when the resource changed.
			task.inputs.property('berylliumEraExcludedMixins', eraExcludedMixins.toList().sort().join(','))
			task.doLast {
				def destination = task.destinationDir
				if (destination != null && destination.isDirectory()) {
					fileTree(destination) { include '*.mixins.json' }.each { config ->
						removeEraExcludedMixins(config)
					}
				}
			}
		}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(17)
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}

/** Prints the selected profile in local/CI logs before expensive Loom work begins. */
tasks.register('printBuildTarget') {
	group = 'verification'
	description = 'Prints the exact Minecraft target and Beryllium compatibility profile.'
	doLast {
		println "Beryllium target: Minecraft ${minecraftVersion}; full optimization set" +
			"; ${unobfuscatedGame ? 'unobfuscated' : 'remapped'} Loom pipeline" +
			"; ViewArea=${hasViewArea}, drawInBatch text hooks=${textUsesDrawInBatch}" +
			"; extract render state=${hasExtractRenderState}, moved chat types=${hasMovedChatTypes}" +
			"; excluded mixins=${eraExcludedMixins.sort().join(',') ?: 'none'}"
	}
}

tasks.named('build') {
	dependsOn tasks.named('printBuildTarget')
}
