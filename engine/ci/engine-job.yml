# Engine CI job — reference copy.
#
# This is now LIVE: the same job runs from .github/workflows/engine.yml on every
# push and pull request. Keep the two in sync if you change the steps; this file
# is the annotated original, the workflow is what GitHub actually executes.
#
# The header below used to claim this could not be committed under
# .github/workflows/ because the pushing GitHub App lacked the `workflows`
# permission. That was wrong, or stopped being true — .github/workflows/probe.yml
# has been edited from the same setup, and engine.yml landed the same way. Do not
# repeat the claim without testing it.
#
# All steps were run and passed locally (ubuntu, gcc):
#
#   make -j"$(nproc)" EXTRA_CFLAGS="-Werror"                    # clean, no warnings
#   make test                       -> 2510 checks, 0 failed
#   ./build/beryl ... --screenshot  # + tools/pngstat.py --strict
#   make test under -fsanitize=address,undefined  -> clean, leak-free
#   make ANDROID=1 test                           -> same suite under LTO + --gc-sections
#
# The `[beryl error] gl: draw_indexed without a bind in the current pass` line in
# the test output is expected: test_gl_backend deliberately asserts that drawing
# before a bind is *refused*, and refusing it is what logs that error.

name: engine
on: [push, pull_request]

jobs:
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: build (warnings are errors)
        run: make -j"$(nproc)" EXTRA_CFLAGS="-Werror"
      - name: test
        run: make test EXTRA_CFLAGS="-Werror"
      - name: render a frame and verify it is not blank
        run: |
          ./build/beryl --quiet --frames 1 --view-distance 12 --screenshot ci-frame.png
          python3 tools/pngstat.py --strict ci-frame.png
      - name: phone profile builds and passes the same suite
        run: make clean && make ANDROID=1 -j"$(nproc)" test
      - name: test under address/undefined sanitizers
        run: |
          make clean
          make test -j"$(nproc)" \
            EXTRA_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g" \
            EXTRA_LDFLAGS="-fsanitize=address,undefined"
      - name: upload the rendered frame
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beryllium-engine-frame
          path: engine/ci-frame.png
